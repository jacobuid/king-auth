name: Deploy King Auth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostdive-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: king-auth-ci-only
          MARIADB_DATABASE: king_auth_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      SSH_HOST: ${{ vars.SSH_HOST || 'lv-shared01.dapanel.net' }}
      SSH_PORT: ${{ vars.SSH_PORT || '53667' }}
      SSH_USER: xdjzyshp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CI_MYSQL_PASSWORD: king-auth-ci-only
      - run: npm run build
      - name: Package application
        run: tar -czf deploy.tar.gz app.js package.json package-lock.json server public packages
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY secret'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing SSH_KNOWN_HOSTS secret'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and restart
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'mkdir -p /home/xdjzyshp/king-auth/tmp'
          scp -P "$SSH_PORT" -o BatchMode=yes deploy.tar.gz "$SSH_USER@$SSH_HOST:/home/xdjzyshp/king-auth/deploy.tar.gz"
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'DEPLOY'
          set -eo pipefail
          cd /home/xdjzyshp/king-auth
          source /home/xdjzyshp/nodevenv/king-auth/24/bin/activate
          set -u
          if [ ! -s .runtime-secret ]; then
            umask 077
            node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))' > .runtime-secret
          fi
          if [ ! -f .env ]; then
            umask 077
            printf '%s\n' 'AUTH_BASE_URL=https://kingauth.app' 'DB_HOST=localhost' 'DB_NAME=xdjzyshp_king-autk' 'DB_USER=xdjzyshp_king-autk' '# Set DB_PASSWORD in DirectAdmin or in this private file.' > .env
          fi
          tar -xzf deploy.tar.gz
          npm ci --omit=dev --ignore-scripts
          touch tmp/restart.txt
          DEPLOY
      - name: Verify public response
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 https://kingauth.app/health | grep -F '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
